name: End-to-end demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: npm
            repeat: '1'
          - profile: full
            repeat: '2'
    defaults:
      run:
        working-directory: git-a2a-demo-acme-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: git-a2a-demo-acme-app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neprel/git-a2a-demo-acme-lib
          ref: e42437fc28e277af0a0726552e3f7ef8972a6c28
          path: git-a2a-demo-acme-lib
      - name: Check scripts and Compose model
        run: |
          bash -n demo/*.sh
          docker compose config -q
      - name: Run ${{ matrix.profile }} profile with published git-a2a 2.0.0
        env:
          DEMO_PROFILE: ${{ matrix.profile }}
          DEMO_REPEAT: ${{ matrix.repeat }}
        run: ./demo/run.sh
      - name: Prove the host checkout was not changed
        run: git diff --exit-code
      - name: Remove demo-owned Docker resources
        if: always()
        run: ./demo/clean.sh
